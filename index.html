<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Something new is taking shape.">
    <meta name="theme-color" content="#F7F6F3">
    <meta property="og:title" content="JKc66 — coming soon">
    <meta property="og:description" content="Something new is taking shape.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://picsum.photos/seed/limewash/1200/630">
    <link rel="canonical" href="https://jkc66.github.io/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://picsum.photos">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="grain" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>
    <div class="hero-wash" aria-hidden="true"></div>
    <div id="cloudscape" class="cloudscape" aria-hidden="true"></div>

    <main id="main" class="shell layout">
        <div class="layout__copy">
            <header class="masthead">
                <p class="eyebrow">Personal site</p>
                <h1 class="title">
                    Something new is taking shape
                    <span class="title-inline">
                        <span class="title-inline__frame" aria-hidden="true">
                            <img
                                class="title-inline__img"
                                src="https://picsum.photos/seed/studio/160/112"
                                width="160"
                                height="112"
                                alt=""
                                decoding="async"
                                fetchpriority="high"
                            >
                        </span>
                        here.
                    </span>
                </h1>
            </header>

            <section class="panel" aria-labelledby="status-heading">
                <h2 id="status-heading" class="visually-hidden">Status</h2>
                
                <div class="status-badge">
                    <span class="status-bolt-container">
                        <i class="ph-fill ph-lightning status-bolt"></i>
                    </span>
                    <span class="status-copy">In progress</span>
                </div>

                <div class="action-zone">
                    <a class="btn" href="https://github.com/JKc66">
                        <i class="ph ph-github-logo"></i>
                        GitHub
                    </a>
                    <div class="signature-wrap">
                        <svg
                            class="signature-mark"
                            viewBox="0 0 168 60"
                            xmlns="http://www.w3.org/2000/svg"
                            role="img"
                            aria-label="JK initials"
                        >
                            <text
                                class="signature-text"
                                x="2"
                                y="42"
                                dominant-baseline="alphabetic"
                            >JK</text>
                            <!-- Light flourish: short arc tucked under the initials -->
                            <path
                                class="signature-mark__stroke signature-mark__stroke--swash"
                                pathLength="1"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M 10 46.6 Q 44 48.6 76 46.35 Q 92 45.05 100 43.15"
                            />
                        </svg>
                    </div>
                </div>
            </section>

            <footer class="foot">
                <p class="fine-print">&copy; <span id="year"></span> JKc66.</p>
            </footer>
        </div>

        <aside class="layout__media" aria-label="Visual moodboard">
            <div class="visual-bento">
                <figure class="tile tile--hero">
                    <div class="tile__chrome">
                        <img
                            src="https://picsum.photos/seed/limewash/900/1100"
                            srcset="
                                https://picsum.photos/seed/limewash/600/740 600w,
                                https://picsum.photos/seed/limewash/900/1100 900w
                            "
                            sizes="(min-width: 900px) 42vw, 100vw"
                            width="900"
                            height="1100"
                            alt="Foggy forest with tall trees and soft sunbeams through the mist, no people in frame"
                            decoding="async"
                            loading="eager"
                            fetchpriority="high"
                        >
                    </div>
                    <figcaption class="tile__cap">Forest mist</figcaption>
                </figure>
                <figure class="tile tile--top">
                    <div class="tile__chrome">
                        <img
                            src="https://picsum.photos/id/16/640/520"
                            srcset="
                                https://picsum.photos/id/16/420/340 420w,
                                https://picsum.photos/id/16/640/520 640w
                            "
                            sizes="(min-width: 900px) 28vw, 50vw"
                            width="640"
                            height="520"
                            alt="Calm sea and sky with distant horizon and rocky shore, no people in frame"
                            decoding="async"
                            loading="lazy"
                        >
                    </div>
                    <figcaption class="tile__cap">Tide line</figcaption>
                </figure>
                <figure class="tile tile--btm">
                    <div class="tile__chrome">
                        <img
                            src="https://picsum.photos/id/28/640/520"
                            srcset="
                                https://picsum.photos/id/28/420/340 420w,
                                https://picsum.photos/id/28/640/520 640w
                            "
                            sizes="(min-width: 900px) 28vw, 50vw"
                            width="640"
                            height="520"
                            alt="Forest brook with green trees, rocks, and moving water, no people in frame"
                            decoding="async"
                            loading="lazy"
                        >
                    </div>
                    <figcaption class="tile__cap">Forest brook</figcaption>
                </figure>
            </div>
        </aside>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.clouds.min.js"></script>
    <script>
        document.getElementById("year").textContent = String(new Date().getFullYear());

        let cloudsEffect = null;

        function hasCloudLibrary() {
            return typeof window.THREE !== "undefined"
                && typeof window.VANTA !== "undefined"
                && typeof window.VANTA.CLOUDS === "function";
        }

        function enableClouds(retriesLeft = 40) {
            if (cloudsEffect) {
                return;
            }

            const cloudscapeElement = document.getElementById("cloudscape");
            if (!cloudscapeElement) return;

            if (!hasCloudLibrary()) {
                if (retriesLeft > 0) {
                    window.setTimeout(() => enableClouds(retriesLeft - 1), 200);
                }
                return;
            }

            try {
                cloudsEffect = window.VANTA.CLOUDS({
                    el: cloudscapeElement,
                    THREE: window.THREE,
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    backgroundColor: 0xffffff,
                    skyColor: 0x68b8d7,
                    cloudColor: 0xadc1de,
                    cloudShadowColor: 0x183550,
                    sunColor: 0xff9919,
                    sunGlareColor: 0xff6633,
                    sunlightColor: 0xff9933,
                    speed: 1.0
                });
            } catch (err) {
                console.error("Vanta init error:", err.message);
            }
        }

        function disableClouds() {
            if (!cloudsEffect) return;
            cloudsEffect.destroy();
            cloudsEffect = null;
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.querySelector(".shell.layout").classList.add("is-visible");
            enableClouds();
        });

        window.addEventListener("load", () => {
            if (!cloudsEffect) enableClouds();
        });
    </script>
</body>
</html>
