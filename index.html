    <script>
        document.getElementById("year").textContent = String(new Date().getFullYear());

        /* ── Vanta.js 3D Clouds (deferred, non-blocking) ── */
        let cloudsEffect = null;

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = src;
                s.async = true;
                s.onload = resolve;
                s.onerror = reject;
                document.body.appendChild(s);
            });
        }

        async function initVanta() {
            if (cloudsEffect) return;

            try {
                if (typeof window.THREE === "undefined") {
                    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js");
                }
                if (typeof window.VANTA === "undefined" || !window.VANTA.CLOUDS) {
                    await loadScript("https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.clouds.min.js");
                }

                const el = document.getElementById("cloudscape");
                if (!el) return;

                cloudsEffect = window.VANTA.CLOUDS({
                    el: el,
                    THREE: window.THREE,
                    mouseControls: false,
                    touchControls: false,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    backgroundColor: 0xffffff,
                    skyColor: 0x68b8d7,
                    cloudColor: 0xadc1de,
                    cloudShadowColor: 0x183550,
                    sunColor: 0xff9919,
                    sunGlareColor: 0xff6633,
                    sunlightColor: 0xff9933,
                    speed: 1.0
                });
            } catch (err) {
                console.error("Vanta initialization failed:", err);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.querySelector(".shell.layout").classList.add("is-visible");

            // Defer Vanta loading until after first paint
            if ("requestIdleCallback" in window) {
                window.requestIdleCallback(() => initVanta(), { timeout: 4000 });
            } else {
                setTimeout(initVanta, 2000);
            }
        });
    </script>
