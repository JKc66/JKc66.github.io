<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Cubes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="shape-container" id="shapeContainer">
        <!-- Cubes will be dynamically added here -->
    </div>
    <div class="container">
    </div>

    <script>
        // Track placed cubes
        let placedCubes = [];

        function createCube() {
            const cube = document.createElement('div');
            cube.className = 'cube';
            
            // Create cube faces
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            faces.forEach(face => {
                const div = document.createElement('div');
                div.className = `cube-face face-${face}`;
                cube.appendChild(div);
            });
            
            return cube;
        }

        function getRandomPosition(max) {
            return Math.floor(Math.random() * max);
        }

        function getRandomFloat(min, max) {
            return Math.random() * (max - min) + min;
        }

        function calculateDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function isPositionValid(x, y, scale) {
            // Reduced minimum distance for more dense placement
            const baseMinDistance = 100;
            
            for (const placedCube of placedCubes) {
                const distance = calculateDistance(x, y, placedCube.x, placedCube.y);
                const minRequiredDistance = baseMinDistance * (scale + placedCube.scale) / 2;
                
                if (distance < minRequiredDistance) {
                    return false;
                }
            }
            return true;
        }

        function findValidPosition(scale) {
            const maxAttempts = 100; // Increased attempts for better positioning
            let attempts = 0;
            
            while (attempts < maxAttempts) {
                // Using full viewport range for positioning
                const x = getRandomPosition(100);
                const y = getRandomPosition(100);
                
                if (isPositionValid(x, y, scale)) {
                    return { x, y };
                }
                attempts++;
            }
            
            // If we couldn't find a valid position, try with a smaller scale
            if (scale > 0.3) {
                return findValidPosition(scale * 0.9);
            }
            
            // Last resort: return a position far from others
            let maxDistance = 0;
            let bestPosition = { x: 0, y: 0 };
            
            for (let x = 0; x < 100; x += 5) {
                for (let y = 0; y < 100; y += 5) {
                    let minDistance = Infinity;
                    for (const cube of placedCubes) {
                        const distance = calculateDistance(x, y, cube.x, cube.y);
                        minDistance = Math.min(minDistance, distance);
                    }
                    if (minDistance > maxDistance) {
                        maxDistance = minDistance;
                        bestPosition = { x, y };
                    }
                }
            }
            
            return bestPosition;
        }

        function initShapes() {
            const container = document.getElementById('shapeContainer');
            placedCubes = []; // Reset placed cubes
            const numCubes = 12; // Increased number of cubes

            for (let i = 0; i < numCubes; i++) {
                const cube = createCube();
                
                // Get scale first as it affects positioning
                const scale = getRandomFloat(0.4, 1.2); // Wider scale range
                
                // Find valid position
                const position = findValidPosition(scale);
                
                // Apply position
                cube.style.left = `${position.x}%`;
                cube.style.top = `${position.y}%`;
                
                // Track this cube's position and scale
                placedCubes.push({
                    x: position.x,
                    y: position.y,
                    scale: scale
                });
                
                // Apply scale
                cube.style.transform = `scale(${scale})`;
                
                // Random animation duration
                const duration = getRandomFloat(25, 45); // Slower animations
                cube.style.animationDuration = `${duration}s`;
                
                // Random animation direction
                if (Math.random() > 0.5) {
                    cube.style.animationDirection = 'reverse';
                }
                
                // Random initial rotation
                const rotX = getRandomPosition(360);
                const rotY = getRandomPosition(360);
                const rotZ = getRandomPosition(360);
                cube.style.transform += ` rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
                
                container.appendChild(cube);
            }
        }

        // Initialize shapes when the page loads
        window.addEventListener('load', initShapes);
        
        // Reinitialize shapes when window is resized
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const container = document.getElementById('shapeContainer');
                container.innerHTML = '';
                initShapes();
            }, 250); // Debounce resize events
        });

        // Add resize observer to handle container size changes
        const resizeObserver = new ResizeObserver(() => {
            const container = document.getElementById('shapeContainer');
            container.innerHTML = '';
            initShapes();
        });

        resizeObserver.observe(document.getElementById('shapeContainer'));
    </script>
</body>
</html>
